<!-- ===== DELETE MODAL ===== -->
<div
  class="modal fade"
  id="delete-post-modal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fs-5" id="post-modal-title">Delete Post</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
        <input type="hidden" id="delete-id-input" value="" />
      </div>
      <div class="modal-body">
        Are you sure you want to delete
        <strong id="delete-post-title"></strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-danger"
          id="delete-modal-submit-btn"
          onclick="confirmPostDelete()"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
<!-- ===== DELETE MODAL ===== -->
