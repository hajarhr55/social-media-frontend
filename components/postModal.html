<!-- =====  CREATE AND UPDATE POST MODAL ===== -->
<div
  class="modal fade"
  id="post-modal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="post-header">New Post</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="post-title" class="col-form-label">Title</label>
            <input type="text" class="form-control" id="post-title" />
            <input type="hidden" id="post-id-input" value="" />
          </div>
          <div class="mb-3">
            <textarea
              class="form-control"
              id="post-message"
              rows="4"
            ></textarea>
          </div>
          <div class="mb-3">
            <label for="post-image" class="col-form-label">Image</label>
            <input type="file" class="form-control" id="post-image" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          id="post-modal-submit-btn"
          onclick="savePost()"
        >
          Create Post
        </button>
      </div>
    </div>
  </div>
</div>
<!-- =====  CREATE AND UPDATE POST MODAL ===== -->
