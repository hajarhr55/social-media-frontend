<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>

    <!-- ===== IMPORT AXIOS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- ===== IMPORT FONT AWESOME ICONS ===== -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- ===== IMPORT BOOTSTRAP  ===== -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body style="background: #eeeeee">
    <!-- ===== ADD NEW POST BUTTON ===== -->
    <button
      type="button"
      class="btn btn-primary rounded-circle position-fixed"
      onclick="addBtnClicked()"
      id="add-btn"
      style="
        width: 60px;
        height: 60px;
        bottom: 20px;
        right: 20px;
        z-index: 1040;
      "
    >
      +
    </button>
    <!-- ===== END ADD NEW POST BUTTON  ===== -->

    <!-- =====HEADER COMPONENT===== -->
    <div id="header"></div>
    <!-- ===== MODALS (Create / Edit / Delete) POST ===== -->
    <div id="modal"></div>
    <div id="delete-modal"></div>

    <!-- =====LOADER COMPONENT===== -->
    <div id="loader" style="display: none"></div>

    <!-- ===== ALERTS (Success / Error)===== -->
    <div
      id="alert"
      style="position: fixed; right: 0; bottom: 0; width: 30%; z-index: 9999"
    ></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
      <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-10 col-lg-8">
          <!-- ===== POSTS CONTAINER ===== -->
          <div id="posts" class="posts"></div>
        </div>
      </div>
    </div>
    <!-- ===== END MAIN CONTENT ===== -->

    <!-- ===== MAIN APP SCRIPT ===== -->
    <script src="/js/app.js" defer></script>
    <script>
      const token = localStorage.getItem("token");

      // ===== LOAD PAGE COMPONENTS =====
      Promise.all([
        fetch("/components/header.html").then((r) => r.text()),
        fetch("/components/postModal.html").then((r) => r.text()),
        fetch("/components/deleteModal.html").then((r) => r.text()),
        fetch("/components/loader.html").then((r) => r.text()),
      ]).then(([headerHtml, modalHtml, deleteHtml, loaderHtml]) => {
        document.getElementById("header").innerHTML = headerHtml;
        document.getElementById("modal").innerHTML = modalHtml;
        document.getElementById("delete-modal").innerHTML = deleteHtml;
        document.getElementById("loader").innerHTML = loaderHtml;

        updateHeaderUI();

        getPosts();
      });

      // ===== PAGINATION & SCROLL STATE =====
      let currentPage = 1;
      let isLoading = false;
      let hasMorePosts = true;
      let scrollTimeout;

      window.addEventListener("scroll", () => {
        clearTimeout(scrollTimeout);

        scrollTimeout = setTimeout(() => {
          const endOfPage =
            window.innerHeight + window.pageYOffset >=
            document.body.scrollHeight - 300;

          if (endOfPage) getPosts();
        }, 200);
      });

      // ===== LOAD POSTS =====
      function getPosts() {
        if (!hasMorePosts) return;
        if (isLoading) return;

        isLoading = true;
        toggleLoader(true);
        axios
          .get(`${API_URL}/api/v1/posts?page=${currentPage}`)

          .then((response) => {
            let posts = response.data.posts;
            if (posts.length === 0) {
              hasMorePosts = false;

              return;
            }
            let container = document.getElementById("posts");
            let html = "";
            for (let post of posts) {
              html += createPostCard(post, true);
            }
            container.insertAdjacentHTML("beforeend", html);
            currentPage++;
          })
          .catch((error) => {
            console.error(error);
            showAlert(error.response.data.message, error.response.data.type);
          })
          .finally(() => {
            toggleLoader(false);
            isLoading = false;
          });
      }
    </script>
  </body>
</html>
