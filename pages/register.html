<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>

    <!-- ===== IMPORT AXIOS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- ===== IMPORT BOOTSTRAP ===== -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <!-- =====LOADER COMPONENT===== -->
    <div id="loader" style="display: none"></div>

    <!-- ===== ALERTS (Success / Error)===== -->
    <div
      id="alert"
      style="position: fixed; right: 0; bottom: 0; width: 30%; z-index: 9999"
    ></div>

    <!-- ===== REGISTER FORM ===== -->
    <div class="container mt-5 mb-5">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
          <div class="card shadow p-3">
            <form action="">
              <h2 class="text-center">Register</h2>
              <div class="form-group mb-3">
                <label for="name" class="form-label">Name:</label>
                <input id="name" class="form-control" name="name" type="text" />
              </div>
              <div class="form-group mb-3">
                <label for="username" class="form-label">Username:</label>
                <input
                  id="username"
                  class="form-control"
                  name="username"
                  type="text"
                />
              </div>
              <div class="form-group mb-3">
                <label for="email" class="form-label"> Email:</label>
                <input
                  id="email"
                  class="form-control"
                  name="email"
                  type="text"
                />
              </div>
              <div class="form-group mb-3">
                <label for="password" class="form-label">Password:</label>
                <input
                  id="password"
                  class="form-control"
                  name="password"
                  type="text"
                />
              </div>
              <div class="form-group mb-3">
                <label for="profileimage" class="form-label"
                  >Profile Image:</label
                >
                <input
                  id="profileimage"
                  class="form-control"
                  name="profile_image"
                  type="file"
                />
              </div>
              <div>
                <button
                  onclick="registerBtnClicked()"
                  type="button"
                  id="register-btn"
                  class="btn btn-primary w-100"
                >
                  Register
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- ===== END REGISTER FORM ===== -->

    <!-- ===== MAIN APP SCRIPT ===== -->
    <script src="/js/app.js"></script>
    <script>
      // ===== LOAD PAGE COMPONENTS =====
      fetch("/components/loader.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("loader").innerHTML = data;
          toggleLoader(false);
        });

      // ===== REGISTER USER =====
      function registerBtnClicked() {
        let name = document.getElementById("name").value;
        let username = document.getElementById("username").value;
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
        let profileImage = document.getElementById("profileimage").files[0];

        const formData = new FormData();
        formData.append("name", name);
        formData.append("username", username);
        formData.append("email", email);
        formData.append("password", password);
        formData.append("image", profileImage);
        toggleLoader(true);

        axios
          .post(`${API_URL}/api/v1/register`, formData, {
            headers: {
              "Content-Type": "multipart/form-data",
            },
          })
          .then((response) => {
            localStorage.setItem("token", response.data.token);
            localStorage.setItem("user", JSON.stringify(response.data.user));
            localStorage.setItem("message", response.data.message);
            localStorage.setItem("type", response.data.type);
            window.location.href = "../index.html";
          })
          .catch((error) => {
            showAlert(error.response.data.message, error.response.data.type);
            console.error(error.response.data);
          })
          .finally(() => {
            toggleLoader(false);
          });
      }
    </script>
  </body>
</html>
